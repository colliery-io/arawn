[package]
name = "arawn"
version = "0.1.0"
edition = "2024"

[lib]
name = "arawn_bin"
path = "src/lib.rs"

[[bin]]
name = "arawn"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
arawn-core = { workspace = true }
arawn-embed = { path = "../arawn-embed" }
arawn-mcp = { path = "../arawn-mcp" }
arawn-tui = { path = "../arawn-tui" }
arawn-auth = { workspace = true }
arawn-engine = { workspace = true }
arawn-llm = { workspace = true }
arawn-memory = { path = "../arawn-memory" }
arawn-tool = { workspace = true }
arawn-service = { workspace = true }
arawn-workflow = { path = "../arawn-workflow" }
arawn-storage = { workspace = true }
arawn-integrations = { path = "../arawn-integrations" }
arawn-feeds = { path = "../arawn-feeds" }
arawn-projections = { path = "../arawn-projections" }
arawn-extractor = { path = "../arawn-extractor" }
arawn-steward = { path = "../arawn-steward" }
arawn-ceremonies = { path = "../arawn-ceremonies" }
rusqlite = { version = "0.37", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
# Web GUI asset embedding (ARAWN-I-0070): disk reads in debug for iteration,
# baked into the binary in release — preserves the single-binary story.
rust-embed = "8"
# CORS for the web GUI's browser-facing routes (ARAWN-T-0492 / GUI-G2).
tower-http = { version = "0.6", features = ["cors"] }
# Server-side HTML templating for the web GUI (ARAWN-T-0493 / GUI-F2):
# compile-checked markup, no separate template files to embed. (No `axum`
# feature — we wrap the rendered string in `axum::response::Html` ourselves to
# stay decoupled from maud's axum-version pin.)
maud = "0.26"
chrono = { workspace = true }
chrono-tz = "0.10"
url = "2"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
notify = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
cloacina-build = "0.6"
